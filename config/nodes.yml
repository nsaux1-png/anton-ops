# The machines in the cluster. Ansible reads this file as its inventory (./cluster passes it with -i).
# Groups say what each machine is; cluster_ip is its address on the cluster network.
# Hardware details for Slurm get added here when the Slurm role is built.
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3   # Rocky 9's system Python 3.9, which has the dnf and SELinux bindings
    cluster_network: 172.16.50.0/24
    admin_proxy_host: anton         # admin-only web proxy for the compute nodes (SOP-103)
    admin_proxy_port: 3128
    customer_uid_min: 2000          # accounts from this UID up are customers; admins are 1000-1999 (plan section 6)
    time_server: anton              # compute nodes take their time from here (SOP-105)
    upstream_network: 192.168.4.0/22   # anton's upstream (office) network, shared with other machines
    storage_server: anton           # exports /raiddrive/cluster, mounted as /cluster everywhere (SOP-130)
    test_runner: papaya             # the admin account the weekly tests run as (SOP-191)
    test_repo: /home/papaya/cluster # the repo they run from
  children:
    head:
      hosts:
        anton:
          ansible_connection: local   # ./cluster runs on anton
          cluster_ip: 172.16.50.1
          upstream_ip: 192.168.5.200  # on eno1, the office network
          storage_device: UUID=000658eb-2151-432f-b0e9-d7c43b3f1439   # the RAID1 mirror (md0) mounted at /raiddrive
    login_nodes:                    # where customers log in and install software (a separate machine later: Q8)
      hosts:
        anton:
    compute:
      children:
        gpu_nodes:
          hosts:
            douglas1:
              ansible_host: 172.16.50.11
              cluster_ip: 172.16.50.11
              gpu_count: 10
              gpu_name: NVIDIA GeForce RTX 5070 Ti
              gpu_slots: 10                 # each GPU's share of CPUs and memory is sized for 10 (2026-10-22: no 11th GPU)
              scratch_device: /dev/disk/by-id/nvme-Fanxiang_S660_4TB_26070712629000533   # 4 TB, fitted 2026-10-20 (SOP-132)
              slurm_tmp_disk_mb: 3800000    # /scratch is 3,813,585 MB (2026-10-21); what jobs may ask for with --tmp
              kernel_args:                  # extra kernel options on every boot entry (SOP-107)
                - video=efifb:off           # these six came with the GPU bring-up, before this repo
                - video=vesafb:off
                - iommu=pt
                - pcie_aspm=off
                - pci=realloc=on
                - initcall_debug            # leftover debugging: move to kernel_args_remove at the next planned reboot
                - rd.driver.blacklist=nouveau    # these two come with NVIDIA's driver packages
                - rd.driver.blacklist=nova-core
              gpu_pcie_links:               # measured under load 2026-10-21; a change means a riser or slot problem
                "0000:01:00.0": gen3 x8     # was x4 on 2026-10-19
                "0000:03:00.0": gen3 x8
                "0000:45:00.0": gen3 x8
                "0000:46:00.0": gen3 x8
                "0000:81:00.0": gen3 x8
                "0000:82:00.0": gen3 x8
                "0000:c1:00.0": gen3 x8
                "0000:c2:00.0": gen3 x8
                "0000:c3:00.0": gen3 x8
                "0000:c4:00.0": gen3 x8
              slurm_cpus: 112               # Slurm counts hardware threads
              slurm_sockets: 1
              slurm_cores_per_socket: 56
              slurm_threads_per_core: 2
              slurm_real_memory_mb: 257000  # slurmd -C: 257056 (2026-10-21); a little lower, so a small change
                                            # in what the kernel keeps doesn't invalidate the node
              slurm_gpu_type: nvidia_geforce_rtx_5070_ti   # as NVML names it (slurmd -C, 2026-10-21)
              slurm_core_spec_count: 1      # one core for the system
