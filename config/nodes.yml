# The machines in the cluster. Ansible reads this file as its inventory (./cluster passes it with -i).
# Groups say what each machine is; cluster_ip is its address on the cluster network.
# Hardware details for Slurm get added here when the Slurm role is built.
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3   # Rocky 9's system Python 3.9, which has the dnf and SELinux bindings
    cluster_network: 172.16.50.0/24
    admin_proxy_host: anton         # admin-only web proxy for the compute nodes (SOP-103)
    admin_proxy_port: 3128
    customer_uid_min: 2000          # accounts from this UID up are customers; admins are 1000-1999 (plan section 6)
    time_server: anton              # compute nodes take their time from here (SOP-105)
    upstream_network: 192.168.4.0/22   # anton's upstream (office) network, shared with other machines
    storage_server: anton           # exports /raiddrive/cluster, mounted as /cluster everywhere (SOP-130)
  children:
    head:
      hosts:
        anton:
          ansible_connection: local   # ./cluster runs on anton
          cluster_ip: 172.16.50.1
          upstream_ip: 192.168.5.200  # on eno1, the office network
          storage_device: UUID=000658eb-2151-432f-b0e9-d7c43b3f1439   # the RAID1 mirror (md0) mounted at /raiddrive
    compute:
      children:
        gpu_nodes:
          hosts:
            douglas1:
              ansible_host: 172.16.50.11
              cluster_ip: 172.16.50.11
              gpu_count: 10
              gpu_name: NVIDIA GeForce RTX 5070 Ti
              gpu_slots: 11                 # planned GPUs: each GPU's share of CPUs and memory is sized for 11
              slurm_cpus: 112               # Slurm counts hardware threads
              slurm_sockets: 1
              slurm_cores_per_socket: 56
              slurm_threads_per_core: 2
              slurm_real_memory_mb: 257000  # TO CONFIRM with slurmd -C when douglas1 is back
              slurm_core_spec_count: 1      # one core for the system
