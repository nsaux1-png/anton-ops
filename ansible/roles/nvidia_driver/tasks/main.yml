# NVIDIA driver on GPU nodes (SOP-111): open kernel modules built with DKMS, one pinned version,
# persistence mode on. Reboots the node when the driver isn't loaded yet (first install).
# NVIDIA's repository comes from the nvidia_repo role, which runs first.
- name: Build tools for DKMS, and the versionlock plugin
  ansible.builtin.dnf:
    name:
      - kernel-devel-matched
      - kernel-headers
      - dkms
      - python3-dnf-plugin-versionlock
    state: present

- name: Keep the old nouveau driver from loading
  ansible.builtin.copy:
    src: blacklist-nouveau.conf
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    owner: root
    group: root
    mode: "0644"

# nouveau loads from the initramfs, so the blacklist must be inside the boot kernel's initramfs too.
# Checked directly rather than with a handler, so a run that fails halfway still gets it next time.
- name: Is the blacklist in the boot kernel's initramfs
  ansible.builtin.shell: lsinitrd "/boot/initramfs-$(grubby --default-kernel | sed 's|^/boot/vmlinuz-||').img" | grep -c 'etc/modprobe.d/blacklist-nouveau.conf'
  register: initramfs_blacklist
  changed_when: false
  failed_when: false
  check_mode: false

- name: Rebuild the initramfs with the blacklist
  ansible.builtin.command: dracut --regenerate-all --force
  when: initramfs_blacklist.stdout | trim == '0'

- name: Which NVIDIA driver stream is enabled
  ansible.builtin.command: dnf -q module list --enabled nvidia-driver
  register: nvidia_stream
  changed_when: false
  failed_when: false
  check_mode: false

- name: Enable the {{ nvidia_driver_stream }} stream, so only this branch can be installed
  ansible.builtin.command: dnf -y module enable nvidia-driver:{{ nvidia_driver_stream }}
  when: (nvidia_driver_stream ~ ' [e]') not in nvidia_stream.stdout

# The tasks below need the stream. In a preview of the first run it isn't enabled yet, so they wait.
- name: Driver packages, at the pinned version
  ansible.builtin.dnf:
    name: "{{ nvidia_driver_packages | map('regex_replace', '$', '-' ~ nvidia_driver_version) | list }}"
    state: present
    allow_downgrade: false
  when: not (ansible_check_mode and (nvidia_driver_stream ~ ' [e]') not in nvidia_stream.stdout)

- name: Which NVIDIA packages are installed
  # !unsafe: the rpm format string looks like template syntax, so Ansible must leave it alone.
  ansible.builtin.shell:
    cmd: !unsafe "rpm -qa --qf '%{NAME}-%|EPOCH?{%{EPOCH}}:{0}|:%{VERSION}-%{RELEASE}.*\n' | grep -E '^(kmod-nvidia|nvidia-|libnvidia-)' | sort"
  register: nvidia_installed
  changed_when: false
  check_mode: false

- name: Lock them at this version (OS updates leave the driver alone)
  ansible.builtin.template:
    src: versionlock.list.j2
    dest: /etc/dnf/plugins/versionlock.list
    owner: root
    group: root
    mode: "0644"
  when: nvidia_installed.stdout_lines | length > 0

- name: CUDA compiler for the live tests' GPU check
  ansible.builtin.dnf:
    name:
      - cuda-nvcc-{{ nvidia_test_cuda }}
      - cuda-cudart-devel-{{ nvidia_test_cuda }}
    state: present
  when: not (ansible_check_mode and (nvidia_driver_stream ~ ' [e]') not in nvidia_stream.stdout)

- name: Is the NVIDIA driver loaded (and nouveau gone)
  ansible.builtin.shell: lsmod | awk '{print $1}' | grep -xE 'nvidia|nouveau' | sort | tr '\n' ' '
  register: nvidia_loaded
  changed_when: false
  check_mode: false

# Automatic reboots are off while the boot hang of 2026-10-19 isn't understood (ops log
# 2026-10-19-step2-gpu-driver): an apply must never reboot a node back into it.
- name: Reboot to load the driver (only where nvidia_driver_auto_reboot is true)
  ansible.builtin.reboot:
    reboot_timeout: 1200
    msg: "Rebooting to load the NVIDIA driver (SOP-111)"
  when: nvidia_loaded.stdout | trim != 'nvidia' and not ansible_check_mode and nvidia_driver_auto_reboot

- name: Say that a reboot is needed
  ansible.builtin.debug:
    msg: "The NVIDIA driver isn't loaded on {{ inventory_hostname }}: reboot it by hand, following SOP-111."
  when: nvidia_loaded.stdout | trim != 'nvidia' and not nvidia_driver_auto_reboot

# Only after the reboot: the daemon needs the NVIDIA driver loaded.
- name: Persistence mode, so GPUs stay ready between jobs
  ansible.builtin.systemd:
    name: nvidia-persistenced
    enabled: true
    state: started
  when: not (ansible_check_mode and nvidia_installed.stdout_lines | length == 0)
