# NVIDIA driver on GPU nodes (SOP-111).
# R580 is NVIDIA's long-term support branch (supported to June 2028, CUDA 13). The open kernel
# modules are required for RTX 50-series (Blackwell) cards.
nvidia_driver_stream: 580-open
nvidia_driver_version: "3:580.105.08-1.el9"

# Compute-only install: no X11 or desktop parts.
nvidia_driver_packages:
  - kmod-nvidia-open-dkms
  - nvidia-driver-cuda
  - nvidia-persistenced

# CUDA compiler, used only to build the GPU check in the live tests. Customers bring their own CUDA.
nvidia_test_cuda: "13-0"

# Off until the boot hang of 2026-10-19 is understood: the role never reboots a node by itself.
nvidia_driver_auto_reboot: false
