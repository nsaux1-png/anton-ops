# Customer groups and users on every machine, from config/customers.yml and config/uids.yml (SOP-141).
# The same UID and GID everywhere, no password (SSH keys only), no real names in /etc/passwd,
# and only one group: the customer's, which carries the customer's storage limit.
- name: Customer groups
  ansible.builtin.group:
    name: "{{ item.code }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ accounts.customers }}"
  loop_control:
    label: "{{ item.code }}"

- name: Customer users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.customer }}"
    groups: ""
    append: false
    comment: ""
    home: "/cluster/home/{{ item.name }}"
    create_home: false            # home folders are made on the storage (role customer_storage)
    shell: "{{ '/bin/bash' if item.status == 'active' else '/sbin/nologin' }}"
    password: "!!"
    expires: "{{ -1 if item.status == 'active' else 86400 }}"   # expired on 2 Jan 1970: no login at all (day 0 is ambiguous)
  loop: "{{ accounts.users }}"
  loop_control:
    label: "{{ item.name }} ({{ item.customer }}, {{ item.status }})"
