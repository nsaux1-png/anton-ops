# Slurm on compute nodes (SOP-155): slurmd, GPUs found through NVIDIA's library, logins only for users
# with a job on the node (pam_slurm_adopt; admins exempt), and job processes hidden from each other.
# Applied to a node only with a spare SSH session to it open, so a mistake in the login rules can be
# undone through it (SOP-155).
- name: Cluster zone on the node
  ansible.posix.firewalld:
    zone: cluster
    state: present
    permanent: true
  register: node_zone

- name: Reload firewalld so the new zone is active
  ansible.builtin.service:
    name: firewalld
    state: reloaded
  when: node_zone is changed and not ansible_check_mode

# Open the zone before sending traffic to it: the other way round cut off new SSH logins to douglas1
# on 2026-10-21 (ops log 2026-10-21-douglas1-setup).
- name: SSH open to the cluster network
  ansible.posix.firewalld:
    zone: cluster
    service: ssh
    permanent: true
    immediate: true
    state: enabled
  when: not (ansible_check_mode and node_zone is changed)

- name: slurmd, and srun inside jobs, open to the cluster network
  ansible.posix.firewalld:
    zone: cluster
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - 6818/tcp                                       # slurmd
    - "{{ slurm_srun_ports }}/tcp"                    # srun in a job script listens here (multi-node jobs)
  when: not (ansible_check_mode and node_zone is changed)

- name: Traffic from the cluster network uses the cluster zone
  ansible.posix.firewalld:
    zone: cluster
    source: "{{ cluster_network }}"
    permanent: true
    immediate: true
    state: enabled
  when: not (ansible_check_mode and node_zone is changed)

- name: gres.conf (NVIDIA's library finds the GPUs and their model)
  ansible.builtin.copy:
    dest: /etc/slurm/gres.conf
    content: |
      # Managed by Ansible (ansible/roles/slurm_node), SOP-155.
      AutoDetect=nvml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Slurm daemons

- name: Task prolog (each task's environment, SOP-155)
  ansible.builtin.copy:
    src: task_prolog.sh
    dest: /etc/slurm/task_prolog.sh
    owner: root
    group: root
    mode: "0755"

- name: slurmd's spool folder
  ansible.builtin.file:
    path: /var/spool/slurmd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Folder for slurmd's systemd settings
  ansible.builtin.file:
    path: /etc/systemd/system/slurmd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Job processes see only their own user's processes
  ansible.builtin.copy:
    src: hide-processes.conf
    dest: /etc/systemd/system/slurmd.service.d/hide-processes.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Slurm daemons

- name: PMIx, which Slurm's MPI plugin loads (srun --mpi=pmix)
  ansible.builtin.dnf:
    name: pmix
    state: present
  notify: Restart Slurm daemons

# Changing this file while jobs run can disturb them (job_container.conf(5)): apply it with the node idle.
- name: job_container.conf (each job's private /tmp on /scratch, and its own /dev/shm)
  ansible.builtin.copy:
    dest: /etc/slurm/job_container.conf
    content: |
      # Managed by Ansible (ansible/roles/slurm_node), SOP-132.
      AutoBasePath=true
      BasePath=/scratch/slurm
    owner: root
    group: root
    mode: "0644"
  notify: Restart Slurm daemons

- name: No namespace.yaml (that's for namespace/linux, which our build can't read)
  ansible.builtin.file:
    path: /etc/slurm/namespace.yaml
    state: absent
  notify: Restart Slurm daemons

- name: Run slurmd now and at boot
  ansible.builtin.systemd:
    name: slurmd
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and (slurm_packages is changed or slurm_packages is skipped))   # first-run preview

# SELinux keeps sshd from reaching the job steps' sockets, which pam_slurm_adopt needs: a small policy
# module allows exactly that (files/cluster_pam_slurm_adopt.te).
- name: Folder for our SELinux policy sources
  ansible.builtin.file:
    path: /usr/local/share/cluster/selinux
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_selinux.status == "enabled"

- name: SELinux rules for pam_slurm_adopt (source)
  ansible.builtin.copy:
    src: cluster_pam_slurm_adopt.te
    dest: /usr/local/share/cluster/selinux/cluster_pam_slurm_adopt.te
    owner: root
    group: root
    mode: "0644"
  register: adopt_policy_source
  when: ansible_selinux.status == "enabled"

- name: Which SELinux policy modules are loaded
  ansible.builtin.command: semodule -l
  register: selinux_modules
  changed_when: ansible_check_mode and 'cluster_pam_slurm_adopt' not in selinux_modules.stdout_lines
  check_mode: false
  when: ansible_selinux.status == "enabled"

- name: Build and load the SELinux rules for pam_slurm_adopt
  ansible.builtin.shell: |
    set -euo pipefail
    d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
    checkmodule -M -m -o "$d/cluster_pam_slurm_adopt.mod" /usr/local/share/cluster/selinux/cluster_pam_slurm_adopt.te
    semodule_package -o "$d/cluster_pam_slurm_adopt.pp" -m "$d/cluster_pam_slurm_adopt.mod"
    semodule -i "$d/cluster_pam_slurm_adopt.pp"
  when: >-
    ansible_selinux.status == "enabled" and
    (adopt_policy_source is changed or 'cluster_pam_slurm_adopt' not in selinux_modules.stdout_lines)

# password-auth's account part ends with "sufficient pam_localuser.so". Pulled in with "include", that
# ends the whole check for every local user before pam_slurm_adopt, so customers got in without a job
# (live tests, 2026-10-21). As a substack it ends only password-auth's part.
- name: password-auth's account checks as a substack, so the job check after them still runs
  ansible.builtin.replace:
    path: /etc/pam.d/sshd
    regexp: '^account(\s+)include(\s+)password-auth\s*$'
    replace: 'account\1substack\2password-auth'

# Admins (group wheel) skip the check; everyone else needs a running job on this node to log in, and
# their login is put inside that job (so it's limited and billed like the job).
- name: Logins only for users with a job here
  ansible.builtin.blockinfile:
    path: /etc/pam.d/sshd
    marker: "# {mark} pam_slurm_adopt (managed by Ansible, ansible/roles/slurm_node, SOP-155)"
    insertafter: '^account\s+(include|substack)\s+password-auth'
    block: |
      account    [success=done default=ignore] pam_succeed_if.so quiet user ingroup wheel
      account    required     pam_slurm_adopt.so action_adopt_failure=deny action_generic_failure=deny

# pam_systemd would move adopted logins out of the job's cgroup (review R5).
- name: No systemd login sessions on compute nodes
  ansible.builtin.replace:
    path: /etc/authselect/password-auth
    regexp: '^(-?session\s+optional\s+pam_systemd\.so.*)$'
    replace: '# \1   # off on compute nodes: pam_slurm_adopt (SOP-155)'
