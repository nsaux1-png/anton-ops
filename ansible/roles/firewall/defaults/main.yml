# Services anton offers to the cluster network. Later roles add theirs (NFS, Slurm, time).
cluster_zone_services:
  - ssh
  - squid
  - ntp
  - nfs

# Ports anton opens to the cluster network.
cluster_zone_ports:
  - 6817/tcp          # slurmctld: nodes and commands talk to the controller
  - 60001-63000/tcp   # srun on the login node: nodes connect back to interactive jobs
