# Running sessions survive both: sshd's service only stops the listener (KillMode=process).
- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
    daemon_reload: true

# New user service managers pick it up; running ones keep the old setting until they stop.
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
