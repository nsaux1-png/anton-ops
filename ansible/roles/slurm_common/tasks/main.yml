# Slurm on every machine (SOP-152): the slurm system user, munge with one shared key, our own Slurm
# packages (./cluster build slurm, SOP-151) and the configuration files, which are the same everywhere.
- name: slurm group
  ansible.builtin.group:
    name: slurm
    gid: "{{ slurm_user_uid }}"
    system: true

- name: slurm user (runs the controller and accounting; can't log in)
  ansible.builtin.user:
    name: slurm
    uid: "{{ slurm_user_uid }}"
    group: slurm
    system: true
    shell: /sbin/nologin
    home: /var/lib/slurm
    create_home: false
    comment: Slurm

- name: munge (Slurm's authentication between machines)
  ansible.builtin.dnf:
    name: munge
    state: present
  register: munge_package

# Text key (base64 of 768 random bytes): it survives being copied by Ansible unchanged.
- name: munge key, made once on the head node
  ansible.builtin.shell: >-
    umask 077 && openssl rand -base64 768 > /etc/munge/munge.key &&
    chown munge:munge /etc/munge/munge.key && chmod 0400 /etc/munge/munge.key
  args:
    creates: /etc/munge/munge.key
  when: "'head' in group_names"

- name: Read the munge key on the head node
  ansible.builtin.slurp:
    src: /etc/munge/munge.key
  register: munge_key
  delegate_to: "{{ groups['head'][0] }}"
  run_once: true
  failed_when: false        # in a preview of the first run it doesn't exist yet
  no_log: true

- name: The same munge key on every other machine
  ansible.builtin.copy:
    content: "{{ munge_key.content | b64decode }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  when: "'head' not in group_names and munge_key.content is defined"
  no_log: true
  notify: Restart munge

- name: Run munge now and at boot
  ansible.builtin.systemd:
    name: munge
    enabled: true
    state: started
  when: not (ansible_check_mode and munge_package is changed)

- name: Our Slurm packages, copied to machines other than the head node
  ansible.builtin.copy:
    src: "/raiddrive/repos/slurm/{{ slurm_version }}/"
    dest: "/var/local/repos/slurm/{{ slurm_version }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  when: "'head' not in group_names"

- name: Repository of our Slurm packages
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/cluster-slurm.repo
    content: |
      # Managed by Ansible (ansible/roles/slurm_common), SOP-152.
      # Slurm built from SchedMD's checked source on anton (SOP-151). Local files, so no signature check.
      [cluster-slurm]
      name=Slurm {{ slurm_version }} built for this cluster
      baseurl=file://{{ '/raiddrive/repos/slurm/' if 'head' in group_names else '/var/local/repos/slurm/' }}{{ slurm_version }}
      enabled=1
      gpgcheck=0
    owner: root
    group: root
    mode: "0644"
  register: slurm_repo

- name: Slurm packages for this machine's role
  ansible.builtin.dnf:
    name: "{{ (slurm_head_packages if 'head' in group_names else slurm_node_packages)
              | map('regex_replace', '$', '-' ~ slurm_version) | list }}"
    state: present
    update_cache: "{{ slurm_repo is changed }}"
  register: slurm_packages
  when: not (ansible_check_mode and slurm_repo is changed)

- name: Slurm log folder
  ansible.builtin.file:
    path: /var/log/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: "0750"

- name: Slurm configuration folder
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: slurm.conf and cgroup.conf, the same on every machine
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/slurm/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - slurm.conf
    - cgroup.conf
  notify: Restart Slurm daemons
