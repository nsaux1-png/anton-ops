# Slurm accounts, users and limits from config/customers.yml (SOP-154), on the head node.
- name: The accounts tool
  ansible.builtin.copy:
    src: cluster-slurm-accounts
    dest: /usr/local/sbin/cluster-slurm-accounts
    owner: root
    group: root
    mode: "0755"
  register: accounts_tool

- name: Slurm accounts, users and limits
  ansible.builtin.command:
    cmd: "/usr/local/sbin/cluster-slurm-accounts{{ ' --check' if ansible_check_mode else '' }}"
    stdin: >-
      {{ {'cluster': slurm_cluster_name, 'admins': slurm_admins, 'max_queued_jobs': slurm_max_queued_jobs,
          'customers': accounts.customers | map('dict2items') | map('selectattr', 'key', 'in', ['code', 'max_gpus'])
                       | map('items2dict') | list,
          'users': accounts.users | map('dict2items') | map('selectattr', 'key', 'in', ['name', 'customer', 'status', 'max_gpus'])
                   | map('items2dict') | list} | to_json }}
  register: account_changes
  changed_when: account_changes.stdout | length > 0
  check_mode: false
  when: not (ansible_check_mode and (accounts_tool is changed or slurm_packages is skipped))
