# Everything ./cluster apply sets up. Plays and roles run in the order listed.
- name: Every machine
  hosts: all
  become: true
  roles:
    - hosts
    - repos

- name: Head node
  hosts: head
  become: true
  roles:
    - firewall
    - time
    - admin_proxy

- name: Compute nodes
  hosts: compute
  become: true
  roles:
    - egress
    - time

- name: GPU nodes
  hosts: gpu_nodes
  become: true
  roles:
    - nvidia_driver
