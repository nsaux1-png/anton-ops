# Everything ./cluster apply sets up. Plays and roles run in the order listed.
- name: Every machine
  hosts: all
  become: true
  pre_tasks:
    - name: Customers and users (config/customers.yml with config/uids.yml)
      ansible.builtin.set_fact:
        accounts: "{{ lookup('file', playbook_dir ~ '/../config/customers.yml') | from_yaml
                      | cluster_accounts(lookup('file', playbook_dir ~ '/../config/uids.yml') | from_yaml) }}"
      tags: always
    - name: Software versions we pin (config/versions.yml)
      ansible.builtin.set_fact:
        slurm_version: "{{ (lookup('file', playbook_dir ~ '/../config/versions.yml') | from_yaml).slurm.version }}"
      tags: always
  roles:
    - hosts
    - role: journal
      tags: journal
    - role: kernel_args
      tags: kernel_args
    - repos
    - accounts
    - customer_access
    - user_environment

- name: Head node
  hosts: head
  become: true
  roles:
    - firewall
    - fail2ban
    - time
    - admin_proxy
    - storage
    - customer_storage
    - nvidia_repo         # NVML headers for building Slurm
    - slurm_common
    - slurm_db
    - slurm_controller
    - slurm_accounts
    - billing
    - shared_software
    - backup
    - test_schedule

- name: Compute nodes
  hosts: compute
  become: true
  roles:
    - egress
    - time
    - shared_storage
    - slurm_common
    - slurm_node

- name: GPU nodes
  hosts: gpu_nodes
  become: true
  roles:
    - nvidia_repo
    - nvidia_driver
